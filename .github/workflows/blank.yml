name: Unpack site
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the site into the repo root
        run: |
          set -e
          unzip -q swordmasters-io-full-site-offline*.zip -d /tmp/site
          cp -a /tmp/site/*/. .
          rm -f swordmasters-io-full-site-offline*.zip
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip Trash"
          git push
